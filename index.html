<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171a1f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Fichas de Luz</title></head><body><header><div><small>CADERNO DE CAMPO</small><h1>Fichas de Luz<span>.</span></h1></div><div class="actions"><button id="backup">Backup JSON</button><button id="pdf" class="primary">Exportar PDF</button></div></header><nav><button data-view="projects" class="active">Projetos</button><button data-view="inventory">Equipamentos</button></nav><main><section id="projects"><div class="heading"><div><small>WORKSPACE</small><h2>Projetos de iluminação</h2><p>Do briefing à avaliação final.</p></div><button id="new" class="primary">＋ Novo projeto</button></div><div id="cards" class="cards"></div><p id="empty">Crie seu primeiro projeto para começar a preencher as fichas.</p></section><section id="editor" hidden><div class="heading"><div><button id="back">← Projetos</button><small>PROJETO ATIVO</small><h2 id="title"></h2></div><button id="save" class="primary">Salvar</button></div><div id="tabs" class="tabs"><button data-tab="brief" class="active">Projeto</button><button data-tab="fichas">10 fichas</button><button data-tab="planta">Planta de luz</button><button data-tab="testes">Testes</button><button data-tab="equip">Equipamentos</button></div><div id="content"></div></section><section id="inventory" hidden><div class="heading"><div><small>KIT DE TRABALHO</small><h2>Inventário</h2></div><button id="addGear" class="primary">＋ Adicionar item</button></div><div id="gearList"></div></section></main><dialog id="projectDialog"><form id="projectForm"><h2>Novo projeto</h2><label>Nome<input name="name" required placeholder="Ex.: Institucional — entrevista dupla"></label><label>Cliente<input name="client"></label><label>Data<input name="date" type="date"></label><label>Localização<input name="location"></label><label>Intenção visual<textarea name="intent" rows="3"></textarea></label><div class="actions"><button type="button" id="cancelProject">Cancelar</button><button class="primary">Criar projeto</button></div></form></dialog><dialog id="gearDialog"><form id="gearForm"><h2>Adicionar equipamento</h2><label>Nome<input name="name" required></label><label>Categoria<select name="category"><option>Fonte</option><option>Modificador</option><option>Suporte</option><option>Controle</option><option>Elétrica</option><option>Outro</option></select></label><label>Quantidade<input name="qty" type="number" min="1" value="1"></label><label>Notas<input name="notes"></label><div class="actions"><button type="button" id="cancelGear">Cancelar</button><button class="primary">Adicionar</button></div></form></dialog><script src="app.js"></script></body></html>
